# 检查项 secret-scan：跟踪文件的密钥/凭据扫描（真实门禁）。
#
# 机制：git ls-files 的跟踪文本文件 → 具名模式（私钥块 / AWS / GitHub / Slack / OpenAI /
#       Anthropic / Google / JWT）+ 通用赋值（password|token|api_key = "…"）叠加香农熵阈值。
#       报告只打印掩码（前 4 字符 + 长度），不把疑似密钥原文写进日志或报告。
# 阈值：findings 必须为 0（错误级）；测试夹具里的**具名模式**命中也算错误，逐条登记在下面的
#       scope.allow（附原因），而不是把规则改松。模糊的"通用赋值"规则在 test/ 与 fixtures/ 路径下
#       降级为提示级（那里本来就该有占位密钥），仍然逐条打进报告。
schema_version: 1

id: secret-scan
title: 密钥/凭据扫描
stage: static
type: scan
enabled: true
required: true
tags:
  - static
  - security
command: 'node "${repo}/scripts/checks/secret-scan.mjs" --check "${check}" --repo "${repo}" --report-dir "${reportDir}" --artifact "${artifact}"'
windows_command: 'node "${repo}\scripts\checks\secret-scan.mjs" --check "${check}" --repo "${repo}" --report-dir "${reportDir}" --artifact "${artifact}"'
unix_command: 'node "${repo}/scripts/checks/secret-scan.mjs" --check "${check}" --repo "${repo}" --report-dir "${reportDir}" --artifact "${artifact}"'
cwd: ${repo}
env: {}
timeout: 300
threshold:
  enforce: true
  metrics:
    - name: findings
      max: 0
      label: 疑似密钥命中（错误级）
    - name: advisories
      label: 提示级命中（测试/夹具路径下的通用赋值）
    - name: files_scanned
      label: 扫描文件数
    - name: allowed
      label: 已登记豁免
artifacts:
  - reports/artifacts/secret-scan.json
requires:
  - kind: tool
    name: node
    probe: node --version
    min_version: "22"
    reason: 质量体系的检查脚本全部用 Node 内建能力（CI 固定 Node 22）
    install:
      - strategy: winget
        command: winget install --id OpenJS.NodeJS.LTS --source winget
        admin: false
        reason: Windows 用户级安装（生成脚本会自动补 --accept-source-agreements --accept-package-agreements --scope user）
      - strategy: scoop
        command: scoop install nodejs-lts
        admin: false
      - strategy: choco
        command: choco install nodejs-lts -y
        admin: true
        reason: 需要管理员权限：只写文档，不自动执行
    manual: 手动安装 Node 22+（nodejs.org 安装包，或 winget install OpenJS.NodeJS.LTS --scope user）
  - kind: tool
    name: git
    probe: git --version
    reason: 检查脚本用 git ls-files / git diff 判定跟踪文件与变更行（只读）
    install:
      - strategy: winget
        command: winget install --id Git.Git --source winget
        admin: false
        reason: Windows 用户级安装
      - strategy: scoop
        command: scoop install git
        admin: false
      - strategy: choco
        command: choco install git -y
        admin: true
        reason: 需要管理员权限：只写文档，不自动执行
    manual: 手动安装 Git（git-scm.com，或 winget install Git.Git --scope user）
install: []
docs: docs/quality/secret-scan.md
owner: quality-framework
allow_failure: false
scope:
  allow:
    - path: fairy-voice/dsh-fairy-voice/test/index.test.js
      pattern: 'sk-(?:test|live|secret|stt)[A-Za-z0-9-]*-\d{6}'
      reason: 单测夹具里的假密钥（sk-test-…-123456 / sk-live-…-123456 / sk-secret-…-123456 三个占位值），非真实凭据；正则要求结尾是 -<6 位数字>，窄到只匹配这些占位值（注意：这里写全值会让扫描器命中本配置文件本身）
    - path: fairy-voice/dsh-fairy-voice/test/providers.test.js
      pattern: 'sk-(?:test|live|secret|stt)[A-Za-z0-9-]*-\d{6}'
      reason: 同上（sk-live-…7890 为占位值）
    - path: fairy-voice/dsh-fairy-voice/test/stt.test.js
      pattern: 'sk-(?:test|live|secret|stt)[A-Za-z0-9-]*-\d{6}'
      reason: 同上
