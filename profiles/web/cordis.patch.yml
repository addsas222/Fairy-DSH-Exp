# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: danger-full-access

# 人格文本由 dsh-fairy-persona 的人格包接管。patch 是整段 config 替换:该行
# 原本的部署人格键被替换掉,这里把三个 cohort 的键都显式置空——
# `persona` 是 0.1.1/0.1.2 的单段键,`personaPrefix`/`personaSuffix` 是 0.1.5+
# 的前后缀键;各 cohort 会忽略不认识的键(0.1.1 已验证容忍)。
- id: system-prompt
  config:
    persona: ''
    personaPrefix: ''
    personaSuffix: ''

# 搜索枢纽接管 provider 选择:请求时按 fairy-search 设置路由;
# deepseek-official/exa/perplexity/custom 均为可切换后端。
#
# fetchProvider: http 在 0.1.1 底座上是**本仓自行挂载**的通道(那时上游故意不挂、且没有私网
# 阻断);0.1.5 底座起上游自己就挂 `@deepseek-ai/dsh-web-fetch-http`(随 dsh-base 依赖分发,
# 且注释写明"匿名抓取只接受公网 HTTP(S)、解析并校验每个目标、固定每次连接"= 带 SSRF 护栏),
# 于是本仓**不再 insert 那一行**(0.1.5 的 loader 对重复 id 直接报 duplicate loader entry)。
# 这里保留 `fetchProvider: http` 只是重述(base 的 config 就是这两个键,patch 会整行替换)。
- id: web
  config:
    searchProvider: fairy-search-hub
    fetchProvider: http

# 模型侧的抓取开关**不在这里**:host 的 tool-web 行被 @deepseek-ai/dsh-web-app 束
# 冻结为 `disabled: true`(patch 只改 config,改不动 disabled,写了也是死配置),
# 真正的开关在 preset 的 web 工具行上:fairy-full/agent.cordis.yml `fetch: true`、
# fairy-lite 同处 `fetch: false`。上面这条通道只负责让 web.fetch 有 provider 可用。

# 创造模式的回忆能力需要全文索引;first-search 延迟打开以保持启动安静。
# ponytail: 内存索引,跨进程重建;持久索引文件是升级路径。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

- insert:
    # 抓取通道本体:0.1.5 起底座自带此行与依赖(且默认 fetchProvider: http / tool-web.fetch: true),
    # 0.1.1 底座则**只能**由我们挂 —— 所以按底座条件启用,两边都不重复、也都不缺。
    # 判据用启动器导出的环境变量:scripts/start-fairy.cmd 会设 DSH_FAIRY_BASE=011。
    # 行 id 特意**不用** base 的 `web-fetch-http`:cordis 的 loader 在注册期按 id 查重,
    # `disabled: true` 也照报 duplicate loader entry(2026-09-16 实测) —— 只有换 id + 条件禁用
    # 才能既在 0.1.1 上挂上、又不在 0.1.5 上撞车。两行同时启用的情况不存在
    # (0.1.1 无 base 行 / 0.1.5 本行 disabled),所以不会出现 WEB_DUPLICATE_PROVIDER。
    - id: fairy-web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
      disabled: !!js process.env.DSH_FAIRY_BASE !== '011'
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: !!js process.env.DSH_FAIRY_REPO_ROOT + '/browser-dock/dsh-browser-dock/proxy.cjs'
        args: ['--browser', 'chrome', '--headless', '--user-data-dir', !!js process.env.DSH_FAIRY_TEST_HOME + '/playwright-profile']

    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: !!js process.env.DSH_FAIRY_PROFILE_ROOT + '/node_modules/.bin/context7-mcp'
        args: []

    - id: balance-meter
      name: 'dsh-balance-meter'
      inject: [clientModules]

    - id: browser-dock
      name: 'dsh-browser-dock'
      inject: [clientModules]

    - id: fairy-startup
      name: 'dsh-fairy-startup'
      inject: [clientModules]

    - id: fairy-voice
      name: 'dsh-fairy-voice'
      inject: [clientModules]

    - id: fairy-visual
      name: 'dsh-fairy-visual'
      inject: [clientModules]

    # Fairy Full:人格引擎(人格包热切换 + 语音绑定)
    - id: fairy-persona
      name: 'dsh-fairy-persona'
      inject: [clientModules]

    # 模式引擎的 host 桥面(每会话控制器由 fairy-full preset 的 isolate 组挂载)。
    # 行名必须是裸包名:clientModules 扫描按行名解析包的 dsh.client 清单,
    # 子路径名会让模式 chip 的客户端 bundle 进不了 boot 图。包的默认导出即桥面。
    - id: fairy-modes-bridge
      name: 'dsh-fairy-modes'
      inject: [clientModules]

    # 搜索枢纽:设置卡 + 请求时按设置路由到具体搜索后端
    - id: fairy-search
      name: 'dsh-fairy-search'
      inject: [clientModules]

    # 长期记忆:宿主路由 + 设置卡(engine 面由 fairy-full preset 挂载)
    - id: fairy-memory
      name: 'dsh-fairy-memory'
      inject: [clientModules]

    - id: fairy-roleplay
      name: 'dsh-fairy-roleplay'
      inject: [clientModules]
