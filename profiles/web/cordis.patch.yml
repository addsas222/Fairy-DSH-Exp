# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: danger-full-access

# 人格文本由 dsh-fairy-persona 的人格包接管。patch 是整段 config 替换:该行
# 原本的部署人格键被替换掉,这里把三个 cohort 的键都显式置空——
# `persona` 是 0.1.1/0.1.2 的单段键,`personaPrefix`/`personaSuffix` 是 0.1.5+
# 的前后缀键;各 cohort 会忽略不认识的键(0.1.1 已验证容忍)。
- id: system-prompt
  config:
    persona: ''
    personaPrefix: ''
    personaSuffix: ''

# 搜索枢纽接管 provider 选择:请求时按 fairy-search 设置路由;
# deepseek-official/exa/perplexity/custom 均为可切换后端。
#
# 不声明 fetchProvider:上游 dsh-base 故意不挂任何抓取通道(其注释原文:Fetch stays
# disabled and no fetch provider is mounted —— 该通道会让模型自己选抓取目标,等于把
# 内网可达面交出去,`@deepseek-ai/dsh-web-fetch-http` 要自行 mount 才存在)。
# 原先写的 `fetchProvider: http` 指向一个**没有任何插件注册**的 id,于是任何 web.fetch
# 调用都以 `Error: configured web provider "http" is not registered` 失败(实机 2026-09-16;
# 仓库内无任何代码调用 web.fetch,是外部/工具侧触发的)。
# 若要启用抓取:把 `@deepseek-ai/dsh-web-fetch-http` 加进本 profile 依赖并在此 insert 一行,
# 再把 fetchProvider 写回 http —— 这是显式接受 SSRF 取舍的决定,别默默打开。
- id: web
  config:
    searchProvider: fairy-search-hub

# 创造模式的回忆能力需要全文索引;first-search 延迟打开以保持启动安静。
# ponytail: 内存索引,跨进程重建;持久索引文件是升级路径。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: !!js process.env.DSH_FAIRY_REPO_ROOT + '/browser-dock/dsh-browser-dock/proxy.cjs'
        args: ['--browser', 'chrome', '--headless', '--user-data-dir', !!js process.env.DSH_FAIRY_TEST_HOME + '/playwright-profile']

    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: !!js process.env.DSH_FAIRY_PROFILE_ROOT + '/node_modules/.bin/context7-mcp'
        args: []

    - id: balance-meter
      name: 'dsh-balance-meter'
      inject: [clientModules]

    - id: browser-dock
      name: 'dsh-browser-dock'
      inject: [clientModules]

    - id: fairy-startup
      name: 'dsh-fairy-startup'
      inject: [clientModules]

    - id: fairy-voice
      name: 'dsh-fairy-voice'
      inject: [clientModules]

    - id: fairy-visual
      name: 'dsh-fairy-visual'
      inject: [clientModules]

    # Fairy Full:人格引擎(人格包热切换 + 语音绑定)
    - id: fairy-persona
      name: 'dsh-fairy-persona'
      inject: [clientModules]

    # 模式引擎的 host 桥面(每会话控制器由 fairy-full preset 的 isolate 组挂载)。
    # 行名必须是裸包名:clientModules 扫描按行名解析包的 dsh.client 清单,
    # 子路径名会让模式 chip 的客户端 bundle 进不了 boot 图。包的默认导出即桥面。
    - id: fairy-modes-bridge
      name: 'dsh-fairy-modes'
      inject: [clientModules]

    # 搜索枢纽:设置卡 + 请求时按设置路由到具体搜索后端
    - id: fairy-search
      name: 'dsh-fairy-search'
      inject: [clientModules]

    # 长期记忆:宿主路由 + 设置卡(engine 面由 fairy-full preset 挂载)
    - id: fairy-memory
      name: 'dsh-fairy-memory'
      inject: [clientModules]

    - id: fairy-roleplay
      name: 'dsh-fairy-roleplay'
      inject: [clientModules]
