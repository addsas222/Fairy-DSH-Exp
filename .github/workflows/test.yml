name: candidate-tests

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            profiles/web/pnpm-lock.yaml
            fairy-visual/dsh-fairy-visual/pnpm-lock.yaml
            fairy-voice/dsh-fairy-voice/pnpm-lock.yaml
            fairy-startup/dsh-fairy-startup/pnpm-lock.yaml
            browser-dock/dsh-browser-dock/pnpm-lock.yaml
            balance-meter/dsh-balance-meter/pnpm-lock.yaml
            fairy-persona/dsh-fairy-persona/pnpm-lock.yaml
            fairy-modes/dsh-fairy-modes/pnpm-lock.yaml
            fairy-search/dsh-fairy-search/pnpm-lock.yaml
      - name: Install and test visual
        working-directory: fairy-visual/dsh-fairy-visual
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test voice
        working-directory: fairy-voice/dsh-fairy-voice
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test persona
        working-directory: fairy-persona/dsh-fairy-persona
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test modes
        working-directory: fairy-modes/dsh-fairy-modes
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test search
        working-directory: fairy-search/dsh-fairy-search
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
