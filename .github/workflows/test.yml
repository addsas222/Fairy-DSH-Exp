name: candidate-tests

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # One glob instead of the hand-kept list of 12 lockfile paths. Every
          # pnpm-lock.yaml in this repo (the 11 packages + profiles/web) sits
          # exactly one level deep, so this pattern resolves to the same 12
          # files and a new package joins the cache key without editing here.
          # fairy-voice's package-lock.json is not a pnpm lockfile and was never
          # in the old list, so it stays out. Quoted because a plain YAML scalar
          # may not start with `*`.
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Install and test visual
        working-directory: fairy-visual/dsh-fairy-visual
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test voice
        working-directory: fairy-voice/dsh-fairy-voice
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test persona
        working-directory: fairy-persona/dsh-fairy-persona
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test modes
        working-directory: fairy-modes/dsh-fairy-modes
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test search
        working-directory: fairy-search/dsh-fairy-search
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test memory
        working-directory: fairy-memory/dsh-fairy-memory
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test roleplay
        working-directory: fairy-roleplay/dsh-fairy-roleplay
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      - name: Install and test eval
        working-directory: fairy-eval/dsh-fairy-eval
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test
      # Dependency-free self-tests of the create-mode tooling (skill-audit,
      # scaffold-plugin). The full fairy-system suite stays out of CI until an
      # ubuntu pass is recorded for its symlink fixtures.
      - name: Self-test fairy-system tooling
        working-directory: fairy-system
        run: |
          node skill-audit.js --self-test
          node scaffold-plugin.js --self-test
